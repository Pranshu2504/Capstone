<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="description" content="ZORA — your wardrobe, styled." />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" href="/images/icon.png" />
    <title>ZORA</title>
    <style>
      :root {
        /* The app is designed at phone width; this is the frame it renders in. */
        --zora-app-max-width: 460px;
        --zora-bg: #090909;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--zora-bg);
      }

      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif;
        /* Centre the phone frame on wide screens. */
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      /* react-native-web needs a full-height flex container to mount into. */
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: var(--zora-app-max-width);
        height: 100%;
        position: relative;
        overflow: hidden;
        background: var(--zora-bg);
      }

      /* Only draw the frame edge once there is room beside it. */
      @media (min-width: 461px) {
        body {
          background:
            radial-gradient(circle at 50% 0%, #16130c 0%, #070707 60%, #050505 100%);
        }

        #root {
          border-left: 1px solid rgba(201, 168, 76, 0.14);
          border-right: 1px solid rgba(201, 168, 76, 0.14);
          box-shadow: 0 0 80px rgba(0, 0, 0, 0.85);
        }
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Hide scrollbars; the app supplies its own scroll affordances. */
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      #zora-boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #c9a84c;
        font-size: 11px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="zora-boot">ZORA</div>
    </div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
