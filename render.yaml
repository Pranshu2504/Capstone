# Render blueprint for the ZORA backend.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: zora-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required: NODE_ENV=production (below) makes npm skip
    # devDependencies, but the build needs typescript and the @types packages.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zora-db
          property: connectionString
      # Set this to the Vercel production URL after the frontend is deployed.
      # Vercel *.vercel.app preview origins are already allowed in code.
      - key: CORS_ORIGIN
        sync: false

      # ── Virtual try-on (FASHN) ────────────────────────────────────────────
      # Served by this same service, so the frontend needs only one API URL.
      # Without FASHN_API_KEY the wardrobe API still runs; try-on reports 503.
      - key: FASHN_API_KEY
        sync: false
      - key: FASHN_DEFAULT_MODEL
        value: tryon-v1.6
      - key: TRYON_TIMEOUT_MS
        value: "180000"
      - key: TRYON_POLL_INTERVAL_MS
        value: "3000"
      # Free instances have no persistent disk, so mirroring FASHN outputs
      # locally loses them on every restart while looking like it worked.
      # Off, the API returns FASHN's CDN URL, which expires after 3 days.
      - key: PERSIST_OUTPUTS
        value: "false"

databases:
  - name: zora-db
    plan: free
    region: oregon
    databaseName: zora
    user: zora
