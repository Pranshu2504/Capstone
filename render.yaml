# Render blueprint for the ZORA backend.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: zora-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required: NODE_ENV=production (below) makes npm skip
    # devDependencies, but the build needs typescript and the @types packages.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zora-db
          property: connectionString
      # Set this to the Vercel production URL after the frontend is deployed.
      # Vercel *.vercel.app preview origins are already allowed in code.
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: zora-ai
    runtime: node
    plan: free
    region: oregon
    rootDir: ai
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Create one at https://app.fashn.ai → Developer API → Create new API key.
      - key: FASHN_API_KEY
        sync: false
      - key: FASHN_DEFAULT_MODEL
        value: tryon-v1.6
      - key: TRYON_TIMEOUT_MS
        value: "180000"
      - key: TRYON_POLL_INTERVAL_MS
        value: "3000"
      - key: STORAGE_DIR
        value: storage
      - key: PERSIST_OUTPUTS
        value: "true"
      # Set this to the Vercel production URL once known. Vercel *.vercel.app
      # preview origins should be added here too, comma-separated, or leave
      # "*" for now and tighten later.
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: zora-db
    plan: free
    region: oregon
    databaseName: zora
    user: zora
