# Render blueprint for the ZORA backend.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: zora-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zora-db
          property: connectionString
      # Set this to the Vercel production URL after the frontend is deployed.
      # Vercel *.vercel.app preview origins are already allowed in code.
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: zora-db
    plan: free
    region: oregon
    databaseName: zora
    user: zora
